[project]
name = "maimai-bilibili-plugin"
version = "0.6.0"
description = "MaiBot 插件：通过 MCP 刷B站并调用模型生成回想"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "umouyoumou-del" }]
requires-python = ">=3.12,<3.15"
dependencies = [
    "aiohttp>=3.9.0,<4.0.0",
    "bilibili-api-python>=17.4.1,<18.0.0",
    "httpx[socks]>=0.28.0,<1.0.0",
    "json-repair>=0.60.1,<0.61",
    "maibot-plugin-sdk>=2.8.0,<3.0.0",
    "mcp>=1.0.0,<2.0.0",
]

[project.urls]
Repository = "https://github.com/umouyoumou-del/maibot-bilibili-mcp"
Issues = "https://github.com/umouyoumou-del/maibot-bilibili-mcp/issues"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.12.0",
]

[tool.uv]
# 插件由 MaiBot Runner 通过 plugin.py 加载，不需要作为 Python 包安装。
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
